# QA do repositório a cada push: sincronia do progresso + links, paridade PT/EN, XP e segredos.
name: QA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # histórico completo para checar os e-mails dos commits
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install pyyaml pillow
      - name: Progresso em sincronia com progress.yml
        run: python scripts/sync.py --check
      - name: QA (links, paridade, XP, segredos, metadados de imagens)
        run: python scripts/qa.py
